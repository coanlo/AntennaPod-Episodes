name: Private Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties
      - name: Build Free Debug APK
        run: ./gradlew assembleFreeDebug
      - name: Checkstyle and Lint
        run: ./gradlew checkstyle lint
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AntennaPod-Episodensuche-Debug
          path: app/build/outputs/apk/free/debug/*.apk
